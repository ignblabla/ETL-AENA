name: ETL vuelos de salida

on:
  repository_dispatch:
    types: [scheduled-etl] 
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "data/**"

concurrency:
  group: etl-aena
  cancel-in-progress: true 

jobs:
  run-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar el ETL (Extract -> Transform -> Load)
        run: python main.py

      - name: Commit y push de data/ si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --staged --quiet; then
            echo "Sin cambios en data/, no se hace commit."
          else
            git commit -m "Actualizar datos ETL $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi