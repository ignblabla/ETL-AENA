name: ETL vuelos de salida

on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:  # permite lanzarlo manualmente desde la pestaña Actions
  push:
    branches:
      - main  # Cambia a 'master' si ese es el nombre de tu rama principal
    paths-ignore:
      - "data/**"  # Evita que el commit automático del bot dispare un bucle infinito

jobs:
  run-etl:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Permite al workflow hacer commits y push al repositorio

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar el ETL (Extract -> Transform -> Load)
        run: python main.py

      - name: Commit y push de data/ si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --staged --quiet; then
            echo "Sin cambios en data/, no se hace commit."
          else
            git commit -m "Actualizar datos ETL $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi